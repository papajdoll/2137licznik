```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ODLICZANIE DO 21:37</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            transition:
                background 1s ease,
                filter 1s ease;
        }

        .container {
            width: 100%;
            text-align: center;
            padding: 20px;
        }

        /* =========================
           NORMALNY LICZNIK
           ========================= */

        #countdown {
            font-size: clamp(55px, 11vw, 150px);

            font-weight: 900;

            letter-spacing: 4px;

            color: #ffffff;

            text-shadow:
                0 0 8px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #0088ff;

            user-select: none;
        }

        #label {
            margin-top: 25px;

            font-size: clamp(18px, 3vw, 30px);

            color: #00ffff;

            letter-spacing: 5px;

            text-shadow:
                0 0 10px #00ffff,
                0 0 25px #00ffff;
        }

        /* =========================
           EKRAN 21:37
           ========================= */

        #celebration {
            display: none;
        }

        #celebration h1 {
            margin: 0;

            font-size: clamp(45px, 9vw, 140px);

            font-weight: 1000;

            line-height: 1.05;

            color: white;

            text-transform: uppercase;

            text-shadow:
                0 0 5px white,
                0 0 10px #00ffff,
                0 0 25px #00ffff,
                0 0 50px #00ffff,
                0 0 100px #0088ff;

            animation:
                neonPulse 0.8s infinite alternate,
                textPulse 1.2s infinite;
        }

        #celebration p {
            margin-top: 35px;

            font-size: clamp(20px, 4vw, 45px);

            color: #00ffff;

            text-shadow:
                0 0 10px #00ffff,
                0 0 30px #00ffff,
                0 0 60px #0088ff;

            animation: fadePulse 1s infinite alternate;
        }

        /* =========================
           ANIMACJE
           ========================= */

        @keyframes neonPulse {

            from {
                filter: brightness(0.8);
                text-shadow:
                    0 0 5px white,
                    0 0 10px #00ffff,
                    0 0 25px #00ffff,
                    0 0 50px #0088ff;
            }

            to {
                filter: brightness(1.6);
                text-shadow:
                    0 0 10px white,
                    0 0 20px #00ffff,
                    0 0 45px #00ffff,
                    0 0 90px #0088ff,
                    0 0 150px #0088ff;
            }
        }

        @keyframes textPulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        @keyframes fadePulse {

            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }

        /* =========================
           TRYB 21:37
           ========================= */

        body.celebration-mode {

            background:
                radial-gradient(
                    circle at center,
                    #102d45 0%,
                    #07121c 35%,
                    #020202 75%
                );

            animation: backgroundPulse 2s infinite alternate;
        }

        @keyframes backgroundPulse {

            from {
                filter: brightness(0.8);
            }

            to {
                filter: brightness(1.3);
            }
        }

        /* =========================
           GWIAZDKI / EFEKTY
           ========================= */

        .particle {

            position: fixed;

            width: 5px;
            height: 5px;

            background: #00ffff;

            border-radius: 50%;

            box-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff;

            pointer-events: none;

            animation: particleMove linear forwards;
        }

        @keyframes particleMove {

            from {
                transform:
                    translate(0, 0)
                    scale(1);

                opacity: 1;
            }

            to {
                transform:
                    translate(var(--x), var(--y))
                    scale(0);

                opacity: 0;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- NORMALNE ODLICZANIE -->

        <div id="normal">

            <div id="countdown">
                ŁADOWANIE...
            </div>

            <div id="label">
                POZOSTAŁO DO 21:37
            </div>

        </div>


        <!-- EKRAN 21:37 -->

        <div id="celebration">

            <h1>
                MAMY 2137<br>
                PROSZĘ PAŃSTWA
            </h1>

            <p>
                BYŁ PAPIEŻ I NIE MA PAPIEŻA HEHE
            </p>

        </div>

    </div>


    <script>

        const countdown =
            document.getElementById("countdown");

        const normal =
            document.getElementById("normal");

        const celebration =
            document.getElementById("celebration");


        let celebrationActive = false;


        /*
         * Tworzenie neonowych cząsteczek
         */

        function createParticle() {

            const particle =
                document.createElement("div");

            particle.classList.add("particle");

            particle.style.left =
                Math.random() * 100 + "vw";

            particle.style.top =
                Math.random() * 100 + "vh";

            const x =
                (Math.random() - 0.5) * 500;

            const y =
                (Math.random() - 0.5) * 500;

            particle.style.setProperty(
                "--x",
                x + "px"
            );

            particle.style.setProperty(
                "--y",
                y + "px"
            );

            particle.style.animationDuration =
                (1 + Math.random() * 2) + "s";

            document.body.appendChild(particle);


            setTimeout(() => {
                particle.remove();
            }, 3000);
        }


        /*
         * Obliczanie czasu do następnego 21:37
         */

        function updateClock() {

            const now = new Date();

            const target = new Date(now);

            target.setHours(21);
            target.setMinutes(37);
            target.setSeconds(0);
            target.setMilliseconds(0);


            /*
             * Jeżeli dzisiejsze 21:37 już minęło,
             * ustawiamy cel na jutro.
             */

            if (now >= target) {

                /*
                 * Ale jeżeli jesteśmy aktualnie
                 * w minucie 21:37, nie przenosimy celu.
                 */

                if (
                    now.getHours() !== 21 ||
                    now.getMinutes() !== 37
                ) {
                    target.setDate(
                        target.getDate() + 1
                    );
                }
            }


            /*
             * SPRAWDZENIE CZY JEST 21:37
             */

            if (
                now.getHours() === 21 &&
                now.getMinutes() === 37
            ) {

                showCelebration();

                return;
            }


            /*
             * Powrót do normalnego trybu
             */

            hideCelebration();


            const difference =
                target.getTime() - now.getTime();


            let totalSeconds =
                Math.floor(difference / 1000);


            const days =
                Math.floor(
                    totalSeconds / 86400
                );

            totalSeconds %= 86400;


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );

            totalSeconds %= 3600;


            const minutes =
                Math.floor(
                    totalSeconds / 60
                );

            const seconds =
                totalSeconds % 60;


            countdown.textContent =
                `${days}d ` +
                `${String(hours).padStart(2, "0")}:` +
                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        }


        /*
         * Pokazanie trybu 21:37
         */

        function showCelebration() {

            if (!celebrationActive) {

                celebrationActive = true;

                normal.style.display = "none";

                celebration.style.display =
                    "block";

                document.body.classList.add(
                    "celebration-mode"
                );
            }


            /*
             * Cząsteczki pojawiają się cały czas
             */

            for (let i = 0; i < 3; i++) {
                createParticle();
            }
        }


        /*
         * Powrót do licznika
         */

        function hideCelebration() {

            if (celebrationActive) {

                celebrationActive = false;

                celebration.style.display =
                    "none";

                normal.style.display =
                    "block";

                document.body.classList.remove(
                    "celebration-mode"
                );
            }
        }


        /*
         * Uruchomienie
         */

        updateClock();


        /*
         * Aktualizacja kilka razy na sekundę,
         * żeby przejście było płynne.
         */

        setInterval(updateClock, 100);


    </script>

</body>
</html>
